name: Feature request
description: Suggest something iinkTS could do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The use case behind the request, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The API or behavior you would expect.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried
      description: Workarounds or other libraries you looked at.
